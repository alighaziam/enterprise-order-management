name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-management-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: enterprise_order_management
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d enterprise_order_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/enterprise_order_management
      DB_USERNAME: app
      DB_PASSWORD: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify frontend JavaScript syntax
        run: |
          node --check src/main/resources/static/assets/console.js
          node --check src/main/resources/static/assets/i18n.js
      - name: Verify backend and integration tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Validate Prometheus configuration and alert rules
        run: |
          mkdir -p /tmp/eom-prometheus-secrets
          printf 'ci-placeholder' > /tmp/eom-prometheus-secrets/eom-operations-token
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            -v "/tmp/eom-prometheus-secrets:/etc/prometheus/secrets:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.5.0 check rules /etc/prometheus/payment-alerts.yml
      - name: Verify Docker image and Compose configuration
        run: |
          mkdir -p docker/runtime/java
          touch docker/runtime/java/.ci-placeholder
          cp target/enterprise-order-management-0.1.0-SNAPSHOT.jar docker/runtime/app.jar
          docker build --tag enterprise-order-management:ci .
          DB_PASSWORD=ci-only \
          WSO2_ISSUER_URI=https://identity.example.test/oauth2/token \
          WSO2_JWKS_URI=https://identity.example.test/oauth2/jwks \
            docker compose config --quiet
