services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: enterprise_order_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise_order_management"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/enterprise_order_management
      DB_USERNAME: app
      DB_PASSWORD: app
    ports:
      - "8080:8080"

volumes:
  postgres_data:
