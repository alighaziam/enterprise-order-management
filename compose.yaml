services:
  postgres:
    image: postgres:17
    container_name: enterprise-order-management-db
    environment:
      POSTGRES_DB: enterprise_order_management
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise_order_management"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
