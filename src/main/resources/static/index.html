<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Enterprise Order Management</title>
  <link rel="stylesheet" href="/assets/console.css?v=8">
  <script>
    (function () {
      var stored = localStorage.getItem("eom.lang");
      var lang = stored === "fa" || stored === "en" ? stored : ((navigator.language || "").toLowerCase().indexOf("fa") === 0 ? "fa" : "en");
      document.documentElement.lang = lang === "fa" ? "fa" : "en";
      document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">EO</div>
        <div>
          <strong id="brand-name">Order desk</strong>
          <span id="brand-note">Enterprise operations</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <footer id="legal">Sandbox payments only. No card numbers are collected and no carrier is called.</footer>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="eyebrow">Desk</p>
          <h1 id="title">Overview</h1>
        </div>
        <div class="top-actions">
          <div class="lang" role="group" aria-label="Language">
            <button class="lang-btn" type="button" data-lang="fa" aria-pressed="false">فارسی</button>
            <button class="lang-btn" type="button" data-lang="en" aria-pressed="true">English</button>
          </div>
          <label class="token-entry">
            <span class="sr-only">WSO2 access token / توکن دسترسی</span>
            <input id="access-token" type="password" dir="ltr" autocomplete="off" spellcheck="false"
                   placeholder="WSO2 access token / توکن دسترسی">
          </label>
          <button class="btn" id="save-token" type="button">Apply token / اعمال توکن</button>
          <span id="health" class="health">Checking</span>
          <button class="btn" id="refresh" type="button">Refresh</button>
          <a class="btn primary" id="new-checkout" href="#/checkout">New checkout</a>
        </div>
      </header>
      <main id="view"></main>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/assets/i18n.js?v=8"></script>
  <script src="/assets/console.js?v=8"></script>
</body>
</html>
