spring:
  application:
    name: enterprise-order-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_order_management}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
  checkout:
    recovery-poll-ms: ${CHECKOUT_RECOVERY_POLL_MS:5000}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
