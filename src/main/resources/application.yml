spring:
  application:
    name: enterprise-order-management
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_order_management}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
